# =====================================================
# Image + Audio → Video (Spring Boot + JavaFX + FFmpeg)
# =====================================================
spring.application.name=image-audio-to-video

# ---- Server (chỉ dùng nếu chạy --server-only hoặc gọi REST API) ----
server.port=8080
server.servlet.context-path=/api

# ---- FFmpeg ----
# Có thể override bằng cách set biến môi trường FFMPEG_PATH trước khi chạy.
# Trên Windows nếu không có trong PATH, đặt đường dẫn đầy đủ ở đây, ví dụ:
# ffmpeg.path=C\:\\ffmpeg\\bin\\ffmpeg.exe
ffmpeg.path=${FFMPEG_PATH:ffmpeg}
ffmpeg.threads=0

# ---- Conversion defaults ----
# 16:9 hoặc 9:16
video.default-aspect=16:9
video.default-resolution-landscape=1280x720
video.default-resolution-portrait=720x1280
video.default-crf=23
video.default-preset=medium
video.default-audio-bitrate=192k
video.default-duration=0  # 0 = use audio duration; >0 = fixed video length in seconds

# ---- Logging ----
logging.level.root=INFO
logging.level.com.thaivideo=INFO
